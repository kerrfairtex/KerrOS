version: 1
# Deploy/mutation tools — blocked by default; require /scope arm-deploy window.
# Token scoping: docs/DEVOPS_TOKEN_SCOPING.md + tools/devops_tokens.py
capabilities:
  - name: "tool:github_create_repo"
    kind: "tool"
    permissions: ["deploy"]
    dependencies: ["cli:gh", "env:GITHUB_TOKEN"]
    setup_required: true
    setup_state: "needs_setup"
    metadata:
      gate: "deploy"
      token_env: "GITHUB_TOKEN"
      token_scope: "fine-grained contents+metadata (one repo) or classic repo only"
      notes: "Requires gh CLI and GITHUB_TOKEN; scope_gate DEPLOY_TOOLS."

  - name: "tool:github_push"
    kind: "tool"
    permissions: ["deploy"]
    dependencies: ["cli:git", "env:GITHUB_TOKEN"]
    setup_required: true
    setup_state: "needs_setup"
    metadata:
      gate: "deploy"
      token_env: "GITHUB_TOKEN"
      token_scope: "fine-grained contents+metadata (one repo) or classic repo only"

  - name: "tool:supabase_migrate"
    kind: "tool"
    permissions: ["deploy"]
    dependencies: ["cli:supabase", "env:SUPABASE_ACCESS_TOKEN"]
    setup_required: true
    setup_state: "needs_setup"
    metadata:
      gate: "deploy"
      token_env: "SUPABASE_ACCESS_TOKEN"
      token_scope: "project-scoped Management/CLI token"
      notes: "Prefer SUPABASE_ACCESS_TOKEN; avoid SERVICE_ROLE in agent .env."

  - name: "tool:vercel_deploy"
    kind: "tool"
    permissions: ["deploy"]
    dependencies: ["cli:vercel", "env:VERCEL_TOKEN"]
    setup_required: true
    setup_state: "needs_setup"
    metadata:
      gate: "deploy"
      token_env: "VERCEL_TOKEN"
      token_scope: "one team/project deploy"

  - name: "tool:netlify_deploy"
    kind: "tool"
    permissions: ["deploy"]
    dependencies: ["cli:netlify", "env:NETLIFY_AUTH_TOKEN"]
    setup_required: true
    setup_state: "needs_setup"
    metadata:
      gate: "deploy"
      token_env: "NETLIFY_AUTH_TOKEN"
      token_env_aliases: ["NETLIFTY_API_KEY"]
      token_scope: "site/team-scoped personal access token"
      notes: "NETLIFTY_API_KEY is a legacy alias for NETLIFY_AUTH_TOKEN."

  - name: "tool:railway_deploy"
    kind: "tool"
    permissions: ["deploy"]
    dependencies: ["cli:railway", "env:RAILWAY_API_KEY"]
    setup_required: true
    setup_state: "needs_setup"
    metadata:
      gate: "deploy"
      token_env: "RAILWAY_API_KEY"
      token_scope: "project-scoped API token"

  - name: "tool:cloudflare_deploy"
    kind: "tool"
    permissions: ["deploy"]
    dependencies: ["cli:wrangler", "env:CLOUDFLARE_API_TOKEN"]
    setup_required: true
    setup_state: "needs_setup"
    metadata:
      gate: "deploy"
      token_env: "CLOUDFLARE_API_TOKEN"
      token_scope: "Workers Scripts Edit (+ DNS Edit) on one account/zone"

  - name: "tool:stripe_trigger"
    kind: "tool"
    permissions: ["deploy"]
    dependencies: ["cli:stripe", "env:STRIPE_API_KEY"]
    setup_required: true
    setup_state: "needs_setup"
    metadata:
      gate: "deploy"
      token_env: "STRIPE_API_KEY"
      token_env_aliases: ["STRIPE_SECRET_KEY"]
      token_scope: "sk_test_ or rk_test_ only"
      forbidden_prefixes: ["sk_live_", "rk_live_"]
      notes: "Triggers Stripe test events; live keys are refused by devops_tokens."

  # ── Extra DevOpsAgent surfaces (not all are scope_gate deploy_tools) ──
  - name: "tool:github_open_pr"
    kind: "tool"
    permissions: ["deploy"]
    dependencies: ["cli:gh", "env:GITHUB_TOKEN"]
    setup_required: true
    setup_state: "needs_setup"
    metadata:
      gate: "deploy"
      token_env: "GITHUB_TOKEN"
      module: "tools.devops_agent"
      notes: "Open a pull request via gh; uses devops gate()."

  - name: "tool:supabase_link"
    kind: "tool"
    permissions: ["deploy"]
    dependencies: ["cli:supabase", "env:SUPABASE_ACCESS_TOKEN"]
    setup_required: true
    setup_state: "needs_setup"
    metadata:
      gate: "deploy"
      token_env: "SUPABASE_ACCESS_TOKEN"
      module: "tools.devops_agent"

  - name: "tool:supabase_deploy_function"
    kind: "tool"
    permissions: ["deploy"]
    dependencies: ["cli:supabase", "env:SUPABASE_ACCESS_TOKEN"]
    setup_required: true
    setup_state: "needs_setup"
    metadata:
      gate: "deploy"
      token_env: "SUPABASE_ACCESS_TOKEN"
      module: "tools.devops_agent"

  - name: "tool:supabase_status"
    kind: "tool"
    permissions: ["standard"]
    dependencies: ["cli:supabase"]
    setup_required: true
    setup_state: "needs_setup"
    metadata:
      gate: "read"
      module: "tools.devops_agent"
      notes: "Read-only Supabase project status."

  - name: "tool:stripe_listen"
    kind: "tool"
    permissions: ["standard"]
    dependencies: ["cli:stripe", "env:STRIPE_API_KEY"]
    setup_required: true
    setup_state: "needs_setup"
    metadata:
      gate: "read"
      token_env: "STRIPE_API_KEY"
      module: "tools.devops_agent"
      notes: "Forward Stripe webhooks locally (test mode)."

  - name: "tool:resend_send_test_email"
    kind: "tool"
    permissions: ["deploy"]
    dependencies: ["env:RESEND_API_KEY"]
    setup_required: true
    setup_state: "needs_setup"
    metadata:
      gate: "deploy"
      token_env: "RESEND_API_KEY"
      module: "tools.devops_agent"
      notes: "Stub/test email send via Resend."

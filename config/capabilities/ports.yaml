version: 1
# Kernel ports / runtime services exposed via DI (not user-facing tools).
capabilities:
  - name: "port:llm"
    kind: "port"
    permissions: ["standard"]
    dependencies: ["provider:composite"]
    setup_required: false
    setup_state: "ready"
    metadata:
      service: "llm_port"
      adapter: "adapters.llm.composite_adapter"
      notes: "LLMPort resolved at boot."

  - name: "port:memory"
    kind: "port"
    permissions: ["standard"]
    dependencies: []
    setup_required: false
    setup_state: "ready"
    metadata:
      service: "memory_port"
      notes: "KerrOS RAG / hybrid memory — not OmniRoute memory (P5)."

  - name: "port:tool"
    kind: "port"
    permissions: ["standard"]
    dependencies: []
    setup_required: false
    setup_state: "ready"
    metadata:
      service: "tool_port"
      notes: "ToolPort over router / claw dispatch."

  - name: "port:dispatch"
    kind: "port"
    permissions: ["standard"]
    dependencies: ["port:tool"]
    setup_required: false
    setup_state: "ready"
    metadata:
      service: "dispatch_port"

  - name: "port:search"
    kind: "port"
    permissions: ["standard"]
    dependencies: []
    setup_required: false
    setup_state: "ready"
    metadata:
      service: "search_port"
      adapter: "adapters.search.duckduckgo_adapter"

  - name: "port:embedding"
    kind: "port"
    permissions: ["standard"]
    dependencies: []
    setup_required: false
    setup_state: "ready"
    metadata:
      service: "embedding_port"
      adapter: "adapters.embeddings.sentence_transformers_adapter"

  - name: "port:code_index"
    kind: "port"
    permissions: ["standard"]
    dependencies: []
    setup_required: true
    setup_state: "needs_setup"
    metadata:
      service: "code_index_port"
      adapter: "adapters.code_index.code_index_adapter"
      notes: "ADR-052 soft code index (rg + Fake/tree-sitter); claw tools code_search/code_symbols."

  - name: "port:code_rag"
    kind: "port"
    permissions: ["standard"]
    dependencies: []
    setup_required: true
    setup_state: "needs_setup"
    metadata:
      service: "code_rag_port"
      adapter: "adapters.code_rag.pipeline"
      notes: >
        ADR-107 Soft code-RAG: gitignore scan, incremental re-index, FTS+symbol+graph+vector,
        hybrid retrieve, citations. Separate from MemoryPort. KERROS_CODE_RAG=1.

  - name: "port:storage"
    kind: "port"
    permissions: ["standard"]
    dependencies: []
    setup_required: false
    setup_state: "ready"
    metadata:
      service: "storage_port"
      adapter: "adapters.storage.local_fs_adapter"

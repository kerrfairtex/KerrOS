version: 1
# LLM providers behind LLMPort. OmniRoute stays a single meta-provider
# (omniroute.yaml) — do not expand its ~290 upstream catalog here.
capabilities:
  - name: "provider:composite"
    kind: "provider"
    permissions: ["standard"]
    dependencies: ["provider:cloud"]
    setup_required: false
    setup_state: "ready"
    metadata:
      role: "llm_port"
      adapter: "adapters.llm.composite_adapter"
      notes: "Boot-registered llm_port; local-first when KERROS_LOCAL_LLM=1, else cloud/OmniRoute."

  - name: "provider:groq"
    kind: "provider"
    permissions: ["standard"]
    dependencies: ["env:GROQ_API_KEY"]
    setup_required: true
    setup_state: "needs_setup"
    metadata:
      role: "primary"
      adapter: "adapters.llm.multi_api_adapter"
      chain: "multi_api"
      notes: "Cloud primary per ADR-001."

  - name: "provider:cloud"
    kind: "provider"
    permissions: ["standard"]
    dependencies: ["provider:groq"]
    setup_required: true
    setup_state: "needs_setup"
    metadata:
      role: "fallback_chain"
      adapter: "adapters.llm.multi_api_adapter"
      notes: "Multi-API fallback chain entry point (Groq → NVIDIA → OpenRouter → …)."

  - name: "provider:anthropic"
    kind: "provider"
    permissions: ["standard"]
    dependencies: ["env:ANTHROPIC_API_KEY"]
    setup_required: true
    setup_state: "needs_setup"
    metadata:
      role: "cloud_chain"
      adapter: "adapters.llm.multi_api_adapter"
      chain: "multi_api"

  - name: "provider:nvidia"
    kind: "provider"
    permissions: ["standard"]
    dependencies: ["env:NVIDIA_API_KEY"]
    setup_required: true
    setup_state: "needs_setup"
    metadata:
      role: "cloud_chain"
      adapter: "adapters.llm.multi_api_adapter"
      chain: "multi_api"
      notes: "NVIDIA NIM (incl. Llama 405B route in MultiAPIEngine)."

  - name: "provider:deepseek"
    kind: "provider"
    permissions: ["standard"]
    dependencies: ["env:DEEPSEEK_API_KEY"]
    setup_required: true
    setup_state: "needs_setup"
    metadata:
      role: "cloud_chain"
      adapter: "adapters.llm.multi_api_adapter"
      chain: "multi_api"

  - name: "provider:kimi"
    kind: "provider"
    permissions: ["standard"]
    dependencies: ["env:KIMI_API_KEY"]
    setup_required: true
    setup_state: "needs_setup"
    metadata:
      role: "cloud_chain"
      adapter: "adapters.llm.multi_api_adapter"
      chain: "multi_api"

  - name: "provider:hunyuan"
    kind: "provider"
    permissions: ["standard"]
    dependencies: ["env:HUNYUAN_API_KEY"]
    setup_required: true
    setup_state: "needs_setup"
    metadata:
      role: "cloud_chain"
      adapter: "adapters.llm.multi_api_adapter"
      chain: "multi_api"

  - name: "provider:cohere"
    kind: "provider"
    permissions: ["standard"]
    dependencies: ["env:COHERE_API_KEY"]
    setup_required: true
    setup_state: "needs_setup"
    metadata:
      role: "cloud_chain"
      adapter: "adapters.llm.multi_api_adapter"
      chain: "multi_api"

  - name: "provider:openrouter"
    kind: "provider"
    permissions: ["standard"]
    dependencies: ["env:OPENROUTER_API_KEY"]
    setup_required: true
    setup_state: "needs_setup"
    metadata:
      role: "cloud_chain"
      adapter: "adapters.llm.multi_api_adapter"
      chain: "multi_api"

  - name: "provider:huggingface"
    kind: "provider"
    permissions: ["standard"]
    dependencies: ["env:HUGGINGFACE_API_KEY"]
    setup_required: true
    setup_state: "needs_setup"
    metadata:
      role: "cloud_chain"
      adapter: "adapters.llm.multi_api_adapter"
      chain: "multi_api"

  - name: "provider:gemini"
    kind: "provider"
    permissions: ["standard"]
    dependencies: ["env:GEMINI_API_KEY"]
    setup_required: true
    setup_state: "needs_setup"
    metadata:
      role: "cloud_chain"
      adapter: "adapters.llm.multi_api_adapter"
      chain: "multi_api"

  - name: "provider:ollama"
    kind: "provider"
    permissions: ["standard"]
    dependencies: ["env:OLLAMA_ENDPOINT"]
    setup_required: true
    setup_state: "needs_setup"
    metadata:
      role: "local"
      adapter: "adapters.llm.ollama_adapter"
      default_endpoint: "http://127.0.0.1:11434/v1"
      notes: "C-19 ops kit: deploy/ollama/ + ADR-016."

  - name: "provider:llama_cpp"
    kind: "provider"
    permissions: ["standard"]
    dependencies: ["env:LLAMA_BIN", "env:MODEL_PATH"]
    setup_required: true
    setup_state: "needs_setup"
    metadata:
      role: "local"
      adapter: "adapters.llm.llama_cpp_adapter"
      default_model: "models/qwen0.5b-q4.gguf"
      notes: "ADR-050 offline profile: ChatML + GGUF Q4_K_M via llama.cpp; see config/profiles/offline_qwen05.yaml."

  - name: "provider:vllm"
    kind: "provider"
    permissions: ["standard"]
    dependencies: ["env:VLLM_ENDPOINT"]
    setup_required: true
    setup_state: "needs_setup"
    metadata:
      role: "local"
      adapter: "adapters.llm.vllm_adapter"
      default_endpoint: "http://127.0.0.1:8000/v1"
      notes: "C-19 soft kit: deploy/vllm/ + ADR-048; same OpenAI-compat probe as Ollama."

  - name: "provider:litellm"
    kind: "provider"
    permissions: ["standard"]
    dependencies: ["env:LITELLM_ENDPOINT"]
    setup_required: true
    setup_state: "needs_setup"
    metadata:
      role: "proxy"
      adapter: "adapters.llm.litellm_adapter"
      default_endpoint: "http://127.0.0.1:4000"
      notes: "Also reachable via MultiAPIEngine when LITELLM_ENDPOINT is set."

  - name: "provider:unsloth"
    kind: "provider"
    permissions: ["standard"]
    dependencies: []
    setup_required: true
    setup_state: "needs_setup"
    metadata:
      role: "local"
      adapter: "adapters.llm.unsloth_adapter"
      notes: "Optional local Unsloth inference path."

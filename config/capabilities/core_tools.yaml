version: 1
# Claw workspace tools (tools.registry.TOOL_DEFINITIONS). Boot also bootstraps
# these from TOOL_DEFINITIONS; YAML keeps docs/CAPABILITIES.md in sync.
capabilities:
  - name: "tool:read"
    kind: "tool"
    permissions: ["standard"]
    dependencies: []
    setup_required: false
    setup_state: "ready"
    metadata:
      module: "tools.claw_tools"
      role: "workspace_fs"
      notes: "Read a file from the KerrOS workspace (numbered lines)."

  - name: "tool:write"
    kind: "tool"
    permissions: ["standard"]
    dependencies: []
    setup_required: false
    setup_state: "ready"
    metadata:
      module: "tools.claw_tools"
      role: "workspace_fs"
      notes: "Create or overwrite a workspace file."

  - name: "tool:edit"
    kind: "tool"
    permissions: ["standard"]
    dependencies: []
    setup_required: false
    setup_state: "ready"
    metadata:
      module: "tools.claw_tools"
      role: "workspace_fs"
      notes: "Replace text in a workspace file."

  - name: "tool:list"
    kind: "tool"
    permissions: ["standard"]
    dependencies: []
    setup_required: false
    setup_state: "ready"
    metadata:
      module: "tools.claw_tools"
      role: "workspace_fs"
      notes: "List files and directories in the workspace."

  - name: "tool:exec"
    kind: "tool"
    permissions: ["elevated"]
    dependencies: ["safe_commands"]
    setup_required: true
    setup_state: "needs_setup"
    metadata:
      module: "tools.claw_tools"
      role: "workspace_exec"
      notes: "Shell execution requires safe_commands configuration."

  - name: "tool:apply_patch"
    kind: "tool"
    permissions: ["elevated"]
    dependencies: []
    setup_required: false
    setup_state: "ready"
    metadata:
      module: "tools.claw_tools"
      role: "workspace_fs"
      notes: "Apply a unified diff patch to workspace files."

  - name: "tool:remove"
    kind: "tool"
    permissions: ["elevated"]
    dependencies: []
    setup_required: false
    setup_state: "ready"
    metadata:
      module: "tools.claw_tools"
      role: "workspace_fs"
      notes: "Delete a file or directory in the workspace."

  - name: "tool:code_index_build"
    kind: "tool"
    permissions: ["standard"]
    dependencies: []
    setup_required: false
    setup_state: "ready"
    metadata:
      module: "tools.claw_tools"
      role: "code_index"
      notes: "ADR-052 rebuild workspace code symbol index."

  - name: "tool:code_symbols"
    kind: "tool"
    permissions: ["standard"]
    dependencies: []
    setup_required: false
    setup_state: "ready"
    metadata:
      module: "tools.claw_tools"
      role: "code_index"
      notes: "ADR-052 search indexed symbols by name."

  - name: "tool:code_search"
    kind: "tool"
    permissions: ["standard"]
    dependencies: []
    setup_required: false
    setup_state: "ready"
    metadata:
      module: "tools.claw_tools"
      role: "code_index"
      notes: "ADR-052 content search via ripgrep/python fallback."

  - name: "tool:finetune_plan"
    kind: "tool"
    permissions: ["standard"]
    dependencies: []
    setup_required: false
    setup_state: "ready"
    metadata:
      module: "tools.claw_tools"
      role: "finetune"
      notes: "ADR-053 Fake Unsloth LoRA → GGUF plan."

  - name: "tool:finetune_export"
    kind: "tool"
    permissions: ["elevated"]
    dependencies: []
    setup_required: true
    setup_state: "needs_setup"
    metadata:
      module: "tools.claw_tools"
      role: "finetune"
      notes: "ADR-053 soft GGUF export (gated allow_export)."

  - name: "tool:skills_list"
    kind: "tool"
    permissions: ["standard"]
    dependencies: []
    setup_required: false
    setup_state: "ready"
    metadata:
      module: "tools.claw_tools"
      role: "skills"
      notes: "Compact index of available skills."

  - name: "tool:skill_view"
    kind: "tool"
    permissions: ["standard"]
    dependencies: []
    setup_required: false
    setup_state: "ready"
    metadata:
      module: "tools.claw_tools"
      role: "skills"
      notes: "Load full skill content by name."

  - name: "tool:skill_manage"
    kind: "tool"
    permissions: ["standard"]
    dependencies: ["skills_workspace"]
    setup_required: false
    setup_state: "ready"
    metadata:
      module: "tools.claw_tools"
      role: "skills"
      notes: "Create, update, or delete a skill."

  - name: "tool:kerros_memory"
    kind: "tool"
    permissions: ["standard"]
    dependencies: []
    setup_required: false
    setup_state: "ready"
    metadata:
      module: "memory.kerros_memory"
      role: "agent_memory"
      notes: "ADR-106 unified multi-agent / Scout memory (ON by default)."

  - name: "tool:memory_graph"
    kind: "tool"
    permissions: ["standard"]
    dependencies: []
    setup_required: false
    setup_state: "ready"
    metadata:
      module: "tools.memory_graph"
      role: "agent_memory"
      notes: "ADR-106 entity graph; pairs with bash for tool memory."

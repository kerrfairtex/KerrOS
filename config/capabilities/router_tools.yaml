version: 1
# Router surface (kernel/router.py) aligned with config/scope_policy.yaml.
# Offensive tools require target allowlist; passive tools are always allowed.
capabilities:
  # ── Offensive / recon (scope_gate offensive_tools) ──
  - name: "tool:nmap"
    kind: "tool"
    permissions: ["elevated"]
    dependencies: ["tool:scope_gate"]
    setup_required: false
    setup_state: "ready"
    metadata: {gate: "offensive", module: "kernel.router"}

  - name: "tool:nikto"
    kind: "tool"
    permissions: ["elevated"]
    dependencies: ["tool:scope_gate"]
    setup_required: false
    setup_state: "ready"
    metadata: {gate: "offensive", module: "kernel.router"}

  - name: "tool:osint"
    kind: "tool"
    permissions: ["elevated"]
    dependencies: ["tool:scope_gate"]
    setup_required: false
    setup_state: "ready"
    metadata: {gate: "offensive", module: "kernel.router"}

  - name: "tool:recon"
    kind: "tool"
    permissions: ["elevated"]
    dependencies: ["tool:scope_gate"]
    setup_required: false
    setup_state: "ready"
    metadata: {gate: "offensive", module: "kernel.router"}

  - name: "tool:geoip"
    kind: "tool"
    permissions: ["elevated"]
    dependencies: ["tool:scope_gate"]
    setup_required: false
    setup_state: "ready"
    metadata: {gate: "offensive", module: "kernel.router"}

  - name: "tool:geoint"

  - name: "tool:traceroute"
    kind: "tool"
    permissions: ["elevated"]
    dependencies: ["tool:scope_gate"]
    setup_required: false
    setup_state: "ready"
    metadata: {gate: "offensive", module: "kernel.router"}

  # ── High-value passive router tools ──
  - name: "tool:calc"
    kind: "tool"
    permissions: ["standard"]
    dependencies: []
    setup_required: false
    setup_state: "ready"
    metadata:
      gate: "passive"
      module: "kernel.router"
      notes: "AST-safe math (no eval); used by workflow YAML tool action."

  - name: "tool:sysinfo"
    kind: "tool"
    permissions: ["standard"]
    dependencies: []
    setup_required: false
    setup_state: "ready"
    metadata: {gate: "passive", module: "kernel.router"}

  - name: "tool:bash"
    kind: "tool"
    permissions: ["elevated"]
    dependencies: ["safe_commands"]
    setup_required: true
    setup_state: "needs_setup"
    metadata:
      gate: "passive"
      module: "kernel.router"
      notes: "Legacy router shell path; prefer tool:exec (claw) when available."

  - name: "tool:file_read"
    kind: "tool"
    permissions: ["standard"]
    dependencies: []
    setup_required: false
    setup_state: "ready"
    metadata: {gate: "passive", module: "kernel.router"}

  - name: "tool:file_write"
    kind: "tool"
    permissions: ["standard"]
    dependencies: []
    setup_required: false
    setup_state: "ready"
    metadata: {gate: "passive", module: "kernel.router"}

  - name: "tool:scope_gate"
    kind: "tool"
    permissions: ["elevated"]
    dependencies: []
    setup_required: false
    setup_state: "ready"
    metadata:
      gate: "policy"
      module: "tools.scope_gate"
      notes: "Fail-closed policy engine; not a user-facing router tool, listed as a dependency target."

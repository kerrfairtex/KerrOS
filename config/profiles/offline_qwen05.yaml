# KerrOS offline profile — Phase A–D (ADR-050 … ADR-053)
#
# Activate:
#   export KERROS_OFFLINE_PROFILE=offline_qwen05
#
# Phase D finetune (Fake plan by default):
#   ./scripts/export_qwen05_lora_gguf.sh plan
#   /finetune-plan

name: offline_qwen05
version: 4
prompt_format: chatml
description: "Qwen2.5-0.5B + RAG + coding index + Unsloth LoRA→GGUF soft export"

model:
  id: Qwen2.5-0.5B-Instruct
  gguf: models/qwen0.5b-q4.gguf
  quant: Q4_K_M
  hf_repo: Qwen/Qwen2.5-0.5B-Instruct-GGUF
  hf_file: qwen2.5-0.5b-instruct-q4_k_m.gguf

runtime:
  provider: llama_cpp
  mode: subprocess
  chatml: true

# Phase D — consumed by adapters/llm/unsloth_finetune.py
finetune:
  method: unsloth
  backend: fake
  enabled: false          # set true or KERROS_FINETUNE=1 to plan
  base_model: unsloth/Qwen2.5-0.5B-Instruct
  dataset_path: data/finetune/dataset.jsonl
  output_dir: data/finetune/lora_out
  gguf_out: models/qwen0.5b-q4.gguf
  quant: Q4_K_M
  allow_train: false
  allow_export: false
  max_steps: 10

embeddings:
  model: nomic-ai/nomic-embed-text-v1.5
  dim: 768
  query_prefix: "search_query: "
  document_prefix: "search_document: "
vector:
  primary: sqlite_fts
  optional: faiss
  enabled: true
  index_path: data/faiss/kerros_memory.npz

reranker:
  model: BAAI/bge-reranker-base
  enabled: false

coding:
  enabled: true
  ripgrep: true
  tree_sitter: true
  index_path: data/code_index/index.json

litellm:
  enabled: false

# KerrOS offline profile — Phase A (ADR-050)
#
# Activate:
#   export KERROS_OFFLINE_PROFILE=offline_qwen05
#   # or: KERROS_LLM_PROVIDER=llama_cpp
#   # or: KERROS_LOCAL_LLM=1  (llama.cpp tried first in local-first chain)
#
# Download weights (operator-owned, gitignored):
#   ./scripts/download_qwen05_gguf.sh
#
# Requires a local llama.cpp binary (LLAMA_BIN or ~/llama.cpp/build/bin/…).

name: offline_qwen05
version: 1
prompt_format: chatml
description: "Qwen2.5-0.5B-Instruct Q4_K_M via llama.cpp (AI Assistant baseline)"

model:
  id: Qwen2.5-0.5B-Instruct
  gguf: models/qwen0.5b-q4.gguf
  quant: Q4_K_M
  hf_repo: Qwen/Qwen2.5-0.5B-Instruct-GGUF
  hf_file: qwen2.5-0.5b-instruct-q4_k_m.gguf

runtime:
  provider: llama_cpp
  mode: subprocess   # subprocess | http (LLAMA_CPP_SERVER_ENDPOINT)
  chatml: true

# Phase B+ placeholders (ignored by Phase A loader)
finetune:
  method: unsloth
  enabled: false
embeddings:
  model: nomic-ai/nomic-embed-text-v1.5
vector:
  primary: sqlite_fts
  optional: faiss
reranker:
  model: BAAI/bge-reranker-base
  enabled: false
coding:
  ripgrep: true
  tree_sitter: false
litellm:
  enabled: false

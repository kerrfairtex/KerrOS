# KerrOS offline profile — Phase A–E (ADR-050 … ADR-054)
#
# Activate:
#   export KERROS_OFFLINE_PROFILE=offline_qwen05
#
# Phase E gateway:
#   ./scripts/llama_cpp_docker.sh up --litellm
#   export LLAMA_CPP_SERVER_ENDPOINT=http://127.0.0.1:8080/v1
#   export LITELLM_ENDPOINT=http://127.0.0.1:4000/v1
#   export KERROS_LLM_PROVIDER=litellm

name: offline_qwen05
version: 5
prompt_format: chatml
description: "Qwen2.5-0.5B offline combo + LiteLLM/llama.cpp gateway"

model:
  id: Qwen2.5-0.5B-Instruct
  gguf: models/qwen0.5b-q4.gguf
  quant: Q4_K_M
  hf_repo: Qwen/Qwen2.5-0.5B-Instruct-GGUF
  hf_file: qwen2.5-0.5b-instruct-q4_k_m.gguf

runtime:
  provider: llama_cpp
  mode: subprocess        # or http when LLAMA_CPP_SERVER_ENDPOINT is set
  chatml: true
  server_endpoint: http://127.0.0.1:8080/v1

finetune:
  method: unsloth
  backend: fake
  enabled: false
  base_model: unsloth/Qwen2.5-0.5B-Instruct
  dataset_path: data/finetune/dataset.jsonl
  output_dir: data/finetune/lora_out
  gguf_out: models/qwen0.5b-q4.gguf
  quant: Q4_K_M
  allow_train: false
  allow_export: false
  max_steps: 10

embeddings:
  model: nomic-ai/nomic-embed-text-v1.5
  dim: 768
  query_prefix: "search_query: "
  document_prefix: "search_document: "
vector:
  primary: sqlite_fts
  optional: faiss
  enabled: true
  index_path: data/faiss/kerros_memory.npz

reranker:
  model: BAAI/bge-reranker-base
  enabled: false

coding:
  enabled: true
  ripgrep: true
  tree_sitter: true
  index_path: data/code_index/index.json

# Phase E — LiteLLM gateway over llama.cpp (ADR-054); off by default
litellm:
  enabled: false          # KERROS_LITELLM_ENABLED=1 / KERROS_LLM_PROVIDER=litellm
  endpoint: http://127.0.0.1:4000/v1
  model: qwen0.5b-q4
  compose_dir: deploy/llama_cpp
  allow_live: false


# KerrOS offline profile — Phase A–C (ADR-050 / ADR-051 / ADR-052)
#
# Activate:
#   export KERROS_OFFLINE_PROFILE=offline_qwen05
#
# Coding assistant (Phase C):
#   /code-index
#   /symbols <name>
#   /code-search <pattern>   # or /exec rg …

name: offline_qwen05
version: 3
prompt_format: chatml
description: "Qwen2.5-0.5B + nomic/FAISS RAG + ripgrep/code index"

model:
  id: Qwen2.5-0.5B-Instruct
  gguf: models/qwen0.5b-q4.gguf
  quant: Q4_K_M
  hf_repo: Qwen/Qwen2.5-0.5B-Instruct-GGUF
  hf_file: qwen2.5-0.5b-instruct-q4_k_m.gguf

runtime:
  provider: llama_cpp
  mode: subprocess
  chatml: true

finetune:
  method: unsloth
  enabled: false

embeddings:
  model: nomic-ai/nomic-embed-text-v1.5
  dim: 768
  query_prefix: "search_query: "
  document_prefix: "search_document: "
vector:
  primary: sqlite_fts
  optional: faiss
  enabled: true
  index_path: data/faiss/kerros_memory.npz

reranker:
  model: BAAI/bge-reranker-base
  enabled: false

# Phase C — consumed by CodeIndexAdapter + claw safe_commands (rg)
coding:
  enabled: true
  ripgrep: true
  tree_sitter: true   # soft; Fake regex symbols when package missing
  index_path: data/code_index/index.json

litellm:
  enabled: false

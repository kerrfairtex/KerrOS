# KerrOS offline profile — Phase A + B (ADR-050 / ADR-051)
#
# Activate:
#   export KERROS_OFFLINE_PROFILE=offline_qwen05
#   # or: KERROS_LLM_PROVIDER=llama_cpp
#   # or: KERROS_LOCAL_LLM=1  (llama.cpp tried first in local-first chain)
#
# Download weights (operator-owned, gitignored):
#   ./scripts/download_qwen05_gguf.sh
#
# Requires a local llama.cpp binary (LLAMA_BIN or ~/llama.cpp/build/bin/…).
# Phase B RAG: SQLite FTS primary + optional FAISS (numpy Fake or faiss-cpu).
# Embeddings default to nomic-embed-text-v1.5 (768-d; soft hash mock without ST).

name: offline_qwen05
version: 2
prompt_format: chatml
description: "Qwen2.5-0.5B-Instruct Q4_K_M via llama.cpp + nomic/FAISS RAG"

model:
  id: Qwen2.5-0.5B-Instruct
  gguf: models/qwen0.5b-q4.gguf
  quant: Q4_K_M
  hf_repo: Qwen/Qwen2.5-0.5B-Instruct-GGUF
  hf_file: qwen2.5-0.5b-instruct-q4_k_m.gguf

runtime:
  provider: llama_cpp
  mode: subprocess   # subprocess | http (LLAMA_CPP_SERVER_ENDPOINT)
  chatml: true

# Phase D placeholder
finetune:
  method: unsloth
  enabled: false

# Phase B — consumed by adapters/embeddings/resolve.py + FaissVectorStore
embeddings:
  model: nomic-ai/nomic-embed-text-v1.5
  dim: 768
  query_prefix: "search_query: "
  document_prefix: "search_document: "
vector:
  primary: sqlite_fts
  optional: faiss
  enabled: true          # FAISS soft on when this offline profile is active
  index_path: data/faiss/kerros_memory.npz

# Phase B+ placeholders
reranker:
  model: BAAI/bge-reranker-base
  enabled: false
coding:
  ripgrep: true
  tree_sitter: false
litellm:
  enabled: false

# config/openrouter_tiers.yaml
# ==============================
# Zero-cost-first model registry for KerrOS.
# Synced to operator OpenRouter dashboard + public /api/v1/models (2026-08-04).
#
# HOW TO READ THIS FILE
#   id       : exact OpenRouter model slug sent in the API call
#   free     : true if zero-cost path may call it (usually :free suffix)
#   verified : true means this exact slug exists in the public models API
#              (or returned a live completion). false = dashboard-only /
#              unconfirmed — dead-model tracking will skip on 404.
#   role     : what this model is for (task detection -> tier in core/router.py)
#
# NOTE ON THIS FILE'S FORMAT: every explanatory note below is a '#'
# comment, not a quoted YAML string. Keep notes as '#' lines so Termux /
# mobile smart-quotes cannot break YAML.
#
# COST RULE: the router only calls a `free: false` model if allow_paid=True
# is explicitly passed in. Default is always free-only.
#
# RATE LIMITS (OpenRouter free ids):
#   20 requests/minute (hard cap)
#   50 requests/day    (unfunded)
#   1000 requests/day  (after one-time $10+ credits)

endpoint: https://openrouter.ai/api/v1/chat/completions
# Auth: OPENROUTER_API_KEY from ~/offline_ai/.env (adapter loads it).

tiers:

  # ── Context / retrieval — core/context_builder.py ───────────────────
  # Dashboard shows these; not in public /models list today (may 404).
  embed:
    - id: nvidia/nemotron-3-embed-1b:free
      free: true
      verified: false
      role: embedding
      # dashboard: nemotron-3-embed-1b-20260716

  rerank:
    - id: nvidia/llama-nemotron-rerank-vl-1b-v2:free
      free: true
      verified: false
      role: rerank
      # dashboard: llama-nemotron-rerank-vl-1b-v2
    - id: nvidia/llama-nemotron-embed-vl-1b-v2:free
      free: true
      verified: false
      role: rerank_fallback
      # dashboard: llama-nemotron-embed-vl-1b-v2-20260224

  # ── Coding ───────────────────────────────────────────────────────────
  coding:
    - id: cohere/north-mini-code:free
      free: true
      verified: true
      role: primary
      # dashboard: north-mini-code-20260617
    - id: openai/gpt-oss-20b:free
      free: true
      verified: true
      role: fallback
    - id: nvidia/nemotron-nano-9b-v2:free
      free: true
      verified: true
      role: fallback

  # ── Reasoning / analysis ─────────────────────────────────────────────
  reasoning:
    # Dashboard: S2.1 PRO FREE / s2.1-pro-free-20260729 — not in public
    # catalog today. Kept for account-specific availability; skipped if 404.
    - id: poolside/s2.1-pro:free
      free: true
      verified: false
      role: primary
    - id: nvidia/nemotron-3-ultra-550b-a55b:free
      free: true
      verified: true
      role: fallback
      # was wrongly slugged nvidia/nemotron-3-ultra:free
    - id: nvidia/nemotron-3-super-120b-a12b:free
      free: true
      verified: true
      role: fallback
      # was wrongly slugged nvidia/nemotron-3-super:free
    - id: nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free
      free: true
      verified: true
      role: fallback
    - id: google/gemma-4-31b-it:free
      free: true
      verified: true
      role: fallback
      # was wrongly slugged google/gemma-4-31b:free

  # ── Fast / chat ──────────────────────────────────────────────────────
  chat:
    - id: inclusionai/ling-3.0-flash:free
      free: true
      verified: true
      # confirmed live earlier; dashboard ling-3.0-flash-20260723
      role: primary
    - id: poolside/laguna-xs-2.1:free
      free: true
      verified: true
      role: fallback
    - id: nvidia/nemotron-3-nano-30b-a3b:free
      free: true
      verified: true
      role: fallback
    - id: google/gemma-4-26b-a4b-it:free
      free: true
      verified: true
      role: fallback
      # was wrongly slugged google/gemma-4-26b-a4b:free
    - id: nvidia/nemotron-nano-9b-v2:free
      free: true
      verified: true
      role: fallback

  # ── Research / long-context ──────────────────────────────────────────
  research:
    - id: poolside/laguna-s-2.1:free
      free: true
      verified: true
      role: primary
      # was wrongly slugged poolside/laguna-s2.1:free
    - id: nvidia/nemotron-3-ultra-550b-a55b:free
      free: true
      verified: true
      role: fallback
    - id: google/gemma-4-31b-it:free
      free: true
      verified: true
      role: fallback

  # ── Vision / multimodal ──────────────────────────────────────────────
  vision:
    - id: nvidia/nemotron-nano-12b-v2-vl:free
      free: true
      verified: true
      role: primary
      # was missing :free suffix

  # ── Content safety / moderation ──────────────────────────────────────
  safety:
    - id: nvidia/nemotron-3.5-content-safety:free
      free: true
      verified: true
      role: primary
      # was missing :free suffix

  # ── OpenRouter panel routers (dynamic pricing — NOT on free path) ───
  # Fusion / Body Builder / Pareto / Auto can pick upstream models and are
  # not guaranteed $0. Only used when allow_paid=True.
  routers:
    - id: openrouter/fusion
      free: false
      verified: true
      role: multi_model_panel
    - id: openrouter/pareto-code
      free: false
      verified: true
      role: code_router
      # was wrongly slugged openrouter/pareto-code-router
    - id: openrouter/bodybuilder
      free: false
      verified: true
      role: beta_panel
    - id: openrouter/auto-beta
      free: false
      verified: true
      role: auto_router_beta
    - id: openrouter/auto
      free: false
      verified: true
      role: auto_router

  # ── Catch-all free last resort before local ──────────────────────────
  auto:
    - id: openai/gpt-oss-20b:free
      free: true
      verified: true
      role: catch_all
    - id: inclusionai/ling-3.0-flash:free
      free: true
      verified: true
      role: catch_all

  # ── Explicitly paid — never called unless allow_paid=True ────────────
  paid:
    - id: google/gemini-3.5-flash-lite
      free: false
      verified: true
      role: opt_in_only
    # Also expose panel routers here so paid opt-in can reach them.
    - id: openrouter/fusion
      free: false
      verified: true
      role: opt_in_router
    - id: openrouter/pareto-code
      free: false
      verified: true
      role: opt_in_router
    - id: openrouter/bodybuilder
      free: false
      verified: true
      role: opt_in_router
    - id: openrouter/auto
      free: false
      verified: true
      role: opt_in_router

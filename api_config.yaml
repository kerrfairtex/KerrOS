# KerrOS API & Endpoint Registry
# Load with: config = yaml.safe_load(open("api_config.yaml"))
# Each provider maps to an env var name only — never hardcode keys here.

llm_cloud:
  anthropic:   { env: ANTHROPIC_API_KEY,   base_url: "https://api.anthropic.com/v1", model: "claude-opus-4-7",
                 models: { default: "claude-opus-4-7", coding: "claude-opus-4-7", fast: "claude-sonnet-4-6" } }
  openai:      { env: OPENAI_API_KEY,      base_url: "https://api.openai.com/v1", model: "gpt-5.2",
                 models: { default: "gpt-5.2", coding: "gpt-5.2", fast: "gpt-4o-mini" } }
  groq:        { env: GROQ_API_KEY,        base_url: "https://api.groq.com/openai/v1", model: "llama-3.3-70b-versatile" }
  gemini:      { env: GEMINI_API_KEY,      base_url: "https://generativelanguage.googleapis.com/v1beta" }
  deepseek:    { env: DEEPSEEK_API_KEY,    base_url: "https://api.deepseek.com/v1", model: "deepseek-reasoner",
                 models: { default: "deepseek-reasoner", coding: "deepseek-reasoner", chat: "deepseek-chat" } }
  cohere:      { env: COHERE_API_KEY,      base_url: "https://api.cohere.ai/v1" }
  nvidia_nim:  { env: NVIDIA_API_KEY,      base_url: "https://integrate.api.nvidia.com/v1", model: "meta/llama-3.1-8b-instruct" }
  openrouter:  { env: OPENROUTER_API_KEY,  base_url: "https://openrouter.ai/api/v1", model: "auto" }
  huggingface: { env: HUGGINGFACE_API_KEY, base_url: "https://api-inference.huggingface.co" }
  # cerebras/sambanova model catalogs rotate often — verify before relying on a
  # hardcoded id: curl $base_url/models -H "Authorization: ******"
  cerebras:    { env: CEREBRAS_API_KEY,    base_url: "https://api.cerebras.ai/v1", model: "REPLACE_ME" }
  sambanova:   { env: SAMBANOVA_API_KEY,   base_url: "https://api.sambanova.ai/v1", model: "REPLACE_ME" }
  # Fetch.ai Agentverse / ASI:One — ASI_ONE_API_KEY is preferred; ASI_ONE_KEY legacy alias
  asi_one:     { env: ASI_ONE_API_KEY,     env_aliases: [ASI_ONE_KEY], base_url: "https://api.asi1.ai/v1" }
  agentverse:  { env: AGENTVERSE_API_KEY,  env_aliases: [ASI_ONE_API_KEY, ASI_ONE_KEY],
                 base_url: "https://agentverse.ai/v1", notes: "Fetch.ai Agentverse; often shares ASI:One credentials" }
  # Kimi (Moonshot AI) — strong at coding, long-context, and reasoning tasks
  kimi:        { env: KIMI_API_KEY,        base_url: "https://api.moonshot.cn/v1", model: "moonshot-v1-32k" }
  # Tencent Hunyuan — research, multilingual, and long-context tasks
  hunyuan:     { env: HUNYUAN_API_KEY,     base_url: "https://api.hunyuan.cloud.tencent.com/v1", model: "hunyuan-turbos" }
  # Dyad AI
  dyad:        { env: DYAD_API_KEY,        base_url: "https://api.dyad.sh/v1", model: "dyad-1" }
  # Verge AI
  verge_ai:    { env: VERGE_AI_KEY,        base_url: "https://api.verge.ai/v1", model: "verge-1" }
  # CodX AI coding assistant
  codx:        { env: CODX_API_KEY,        base_url: "https://api.codx.ai/v1", model: "codx-pro" }
  # Snowflake Cortex (LLM via Snowflake account)
  snowflake_cortex: { env: SNOWFLAKE_PAT_KEY, endpoint_env: SNOWFLAKE_PAT_ENDPOINT,
                      notes: "Uses Snowflake PAT; Cortex model selected server-side" }

llm_local:
  ollama:      { env: OLLAMA_ENDPOINT,           default: "http://localhost:11434/v1" }
  lm_studio:   { env: LM_STUDIO_ENDPOINT,        default: "http://localhost:1234/v1" }
  vllm:        { env: VLLM_ENDPOINT,             default: "http://localhost:8000/v1" }
  llama_cpp:   { env: LLAMA_CPP_SERVER_ENDPOINT, default: "http://localhost:8080/v1" }
  kobold_cpp:  { env: KOBOLD_CPP_ENDPOINT,       default: "http://localhost:5001/v1" }
  local_ai:    { env: LOCAL_AI_ENDPOINT,         default: "http://localhost:8080/v1" }
  # LiteLLM proxy — OpenAI-compatible gateway to 100+ providers
  # Run: litellm --model gpt-4o  (or any supported model string)
  litellm:     { env: LITELLM_ENDPOINT,          default: "http://localhost:4000/v1" }
  # Quantized model server (llama.cpp / GGUF models)
  quant:       { env: QUANT_ENDPOINT,            default: "http://localhost:8081/v1" }
  # Local Ollama OpenAI-compatible endpoint (set model via config as needed)
  ollama_chat: { env: OLLAMA_CHAT_ENDPOINT,      default: "http://localhost:11434/v1", model: "llama3.2" }

# Priority order for engine.py fallback chain (edit freely)
fallback_chain:
  - groq
  - nvidia_nim
  - cerebras
  - sambanova
  - kimi
  - deepseek
  - hunyuan
  - openrouter
  - gemini
  - cohere
  - anthropic
  - openai
  - litellm
  - ollama
  - lm_studio
  - vllm
  - llama_cpp
  - kobold_cpp
  - local_ai

# Sol / Terra / Luna — KerrOS routing tier aliases (+ coding / research)
# Reference these in routing config to target a capability tier rather than a
# specific provider.  The engine resolves the tier to its member providers in
# priority order and applies the normal fallback logic within the tier.
routing_tiers:
  sol:
    description: "Fast / lightweight tier — lowest latency, cost-efficient"
    providers:   [groq, cerebras, sambanova, litellm]
  terra:
    description: "Balanced tier — capability + speed tradeoff"
    providers:   [deepseek, kimi, codx, openrouter, litellm]
  luna:
    description: "Heavy / capable tier — maximum quality for complex tasks"
    providers:   [anthropic, openai, hunyuan, nvidia_nim, gemini]
  coding:
    description: "Adaptive coding / execution preference order"
    providers:   [deepseek, codx, anthropic, openai, kimi, dyad, verge_ai, litellm, groq, huggingface]
  research:
    description: "Long-context research / academic synthesis"
    providers:   [anthropic, gemini, hunyuan, openai, deepseek, openrouter, litellm]

vector_db:
  milvus:   { env: MILVUS_ENDPOINT,    default: "http://localhost:19530" }
  qdrant:   { env: QDRANT_ENDPOINT,    default: "http://localhost:6333" }
  chroma:   { env: CHROMA_DB_ENDPOINT, default: "http://localhost:8000" }
  # pgvector — PostgreSQL with the pgvector extension
  # Install: CREATE EXTENSION IF NOT EXISTS vector;
  pgvector: { env: PGVECTOR_DB_URL,    default: "postgresql://localhost:5432/vectordb",
              notes: "Requires pgvector extension installed in PostgreSQL; not default KerrOS MemoryPort" }

database:
  postgresql: { env: LOCAL_POSTGRESQL, default: "postgresql://localhost:5432/barmm_db" }
  snowflake:
    pat_env: SNOWFLAKE_PAT_KEY
    endpoint_env: SNOWFLAKE_PAT_ENDPOINT
  supabase:
    api_env: SUPABASE_LOCAL_ENDPOINT
    default: "http://localhost:54321"
    studio_env: SUPABASE_STUDIO_ENDPOINT
    studio_default: "http://localhost:54323"

storage:
  minio: { env: MINIO_ENDPOINT, default: "http://localhost:9000" }

search_and_research:
  tavily:            { env: TAVILY_API_KEY,   base_url: "https://api.tavily.com" }
  tavily_mcp:        { env: TAVILY_MCP }
  searxng:           { env: SEARXNG_ENDPOINT, default: "http://localhost:8080" }
  scite_ai:          { env: SCITE_AI_KEY,     base_url: "https://api.scite.ai" }
  core_api:          { env: CORE_API_KEY,     base_url: "https://api.core.ac.uk/v3" }
  unpaywall:         { env: UNPAYWALL,        base_url: "https://api.unpaywall.org/v2" }
  semantic_scholar:
    graph:           { env: SEMANTIC_SCHOLAR_GRAPH,           default: "https://api.semanticscholar.org/graph/v1" }
    recommendations: { env: SEMANTIC_SCHOLAR_RECOMMENDATIONS, default: "https://api.semanticscholar.org/recommendations/v1" }
    datasets:        { env: SEMANTIC_SCHOLAR_DATASETS,        default: "https://api.semanticscholar.org/datasets/v1" }
  openalex:          { env: OPENALEX_API_KEY,  base_url: "https://api.openalex.org",
                       notes: "OpenAlex; email/polite pool via OPENALEX_MAILTO when keyless" }
  openalex_mailto:   { env: OPENALEX_MAILTO }
  connected_papers:  { env: CONNECTED_PAPERS_API_KEY, base_url: "https://api.connectedpapers.com" }
  elicit:            { env: ELICIT_API_KEY,    base_url: "https://api.elicit.com" }
  consensus:         { env: CONSENSUS_API_KEY, base_url: "https://api.consensus.app" }
  s2orc:             { env: S2ORC_API_KEY,     env_aliases: [SEMANTIC_SCHOLAR_GRAPH],
                       notes: "Semantic Scholar S2ORC corpus access; often shares S2 credentials" }
  grobid:            { env: GROBID_ENDPOINT,   default: "http://localhost:8070",
                       notes: "Local GROBID PDF→TEI service" }
  asreview:          { env: ASREVIEW_ENDPOINT, default: "http://localhost:5000",
                       notes: "ASReview active learning for systematic reviews" }
  rayyan:            { env: RAYYAN_API_KEY,    base_url: "https://rayyan.ai/api/v1" }

academic_writing:
  jenni:       { env: JENNI_API_KEY,       base_url: "https://api.jenni.ai" }
  paperpal:    { env: PAPERPAL_API_KEY,    base_url: "https://api.paperpal.com" }
  paperguide:  { env: PAPERGUIDE_API_KEY,  base_url: "https://api.paperguide.ai" }
  scispace:    { env: SCISPACE_API_KEY,    base_url: "https://api.typeset.io" }
  writefull:   { env: WRITEFULL_API_KEY,   base_url: "https://api.writefull.com" }
  trinka:      { env: TRINKA_API_KEY,      base_url: "https://api.trinka.ai" }
  latex:
    notes: "Local TeX toolchain (texlive / tectonic) — not an API"
    cli: tectonic

image_generation:
  stable_diffusion:
    # Automatic1111 WebUI — most widely deployed SD frontend
    automatic1111: { env: SD_A1111_ENDPOINT,   default: "http://localhost:7860",
                     api_path: "/sdapi/v1/txt2img" }
    # ComfyUI — node-based workflow engine for SD
    comfyui:       { env: SD_COMFYUI_ENDPOINT, default: "http://localhost:8188",
                     api_path: "/prompt" }
    # Switch between backends: SD_BACKEND=automatic1111 (default) | comfyui
    backend_env: SD_BACKEND

tts:
  # Chatterbox — Resemble AI open-source TTS (local inference)
  # Repo: https://github.com/resemble-ai/chatterbox
  # Run:  python -m chatterbox.server --port 8055
  chatterbox: { env: CHATTERBOX_ENDPOINT, default: "http://localhost:8055",
                api_key_env: CHATTERBOX_API_KEY }

# Coding agents / AI pair programmers (CLI tools, not API services)
# These tools consume LLM provider keys configured elsewhere in this file.
coding_agents:
  aider:
    notes: "AI pair programmer in your terminal. pip install aider-chat"
    model_env: AIDER_MODEL
    docs: "https://aider.chat"
    cli: aider
  cline:
    notes: "VS Code extension — AI coding agent. Configures its own LLM backend."
    docs: "https://github.com/cline/cline"
  goose:
    notes: "Block's open-source AI agent. pip install goose-ai"
    model_env: GOOSE_MODEL
    docs: "https://github.com/block/goose"
    cli: goose
  opencode:
    notes: "Terminal AI coding assistant. npm install -g opencode-ai"
    model_env: OPENCODE_MODEL
    docs: "https://opencode.ai"
    cli: opencode
  codex_cli:
    notes: "OpenAI Codex CLI. npm install -g @openai/codex. Uses OPENAI_API_KEY."
    docs: "https://github.com/openai/codex"
    cli: codex
    env: OPENAI_API_KEY
  tabnine:
    notes: "Tabnine Enterprise — IDE completion; configure via TABNINE_API_KEY / enterprise host"
    env: TABNINE_API_KEY
    endpoint_env: TABNINE_ENDPOINT
    docs: "https://www.tabnine.com"

# Multi-agent frameworks (soft catalog — SDKs operator-installed)
agent_frameworks:
  crewai:
    env: CREWAI_API_KEY
    env_aliases: [OPENAI_API_KEY]
    notes: "CrewAI crews; often reuses OPENAI_API_KEY for underlying LLM"
    docs: "https://docs.crewai.com"
    pip: crewai
  autogen:
    env: AUTOGEN_API_KEY
    env_aliases: [OPENAI_API_KEY, AZURE_OPENAI_API_KEY]
    notes: "Microsoft AutoGen; typically uses OpenAI-compatible keys"
    docs: "https://microsoft.github.io/autogen/"
    pip: autogen-agentchat
  agentverse:
    env: AGENTVERSE_API_KEY
    env_aliases: [ASI_ONE_API_KEY, ASI_ONE_KEY]
    notes: "Fetch.ai Agentverse agent hosting"
    docs: "https://agentverse.ai"

# Browser automation
browser_automation:
  # Chromium via Chrome DevTools Protocol (CDP)
  # Launch: chromium --remote-debugging-port=9222 --headless
  chromium: { env: CHROMIUM_CDP_URL, default: "http://localhost:9222",
              notes: "CDP endpoint for Playwright / Puppeteer browser automation" }

# Apache ecosystem services (data / workflow infrastructure)
apache_services:
  kafka:
    bootstrap_servers_env: KAFKA_BOOTSTRAP_SERVERS
    default: "localhost:9092"
    notes: "Apache Kafka — event streaming / message bus"
  spark:
    master_url_env: SPARK_MASTER_URL
    default: "spark://localhost:7077"
    notes: "Apache Spark — distributed data processing"
  airflow:
    api_url_env: AIRFLOW_API_URL
    default: "http://localhost:8080/api/v1"
    notes: "Apache Airflow — workflow orchestration"

utility_services:
  deepl:       { env: DEEPL_API_KEY,      base_url: "https://api-free.deepl.com/v2" }
  deepl_write: { env: DEEPL_WRITE_API_KEY, env_aliases: [DEEPL_API_KEY],
                 base_url: "https://api-free.deepl.com/v2/write", notes: "DeepL Write; may share DEEPL_API_KEY" }
  deepl_voice: { env: DEEPL_VOICE_API_KEY, env_aliases: [DEEPL_API_KEY],
                 notes: "DeepL Voice — product availability varies by account" }
  elevenlabs:  { env: ELEVENLAB_API_KEY,  base_url: "https://api.elevenlabs.io/v1",
                 model: "eleven_v3", notes: "Prefer Eleven v3 model when account supports it" }
  enverson:    { env: ENVERSON_API_KEY,   notes: "Enverson AI — operator endpoint via ENVERSON_ENDPOINT" ,
                 endpoint_env: ENVERSON_ENDPOINT }
  # NOTE: a ghp_... key is a GitHub Personal Access Token, not a Copilot
  # inference key — Copilot has no public chat-completions API. Use this
  # for GitHub REST/GraphQL calls (repos, issues, PRs) only.
  capilot:     { env: CAPILOT_API_KEY, base_url: "https://api.github.com" }

deploy:
  github:
    token_env: GITHUB_TOKEN
    owner_env: GITHUB_OWNER
    repo_env: GITHUB_REPOSITORY
  vercel:
    token_env: VERCEL_TOKEN
    project_id_env: VERCEL_PROJECT_ID
    org_id_env: VERCEL_ORG_ID
  supabase_prod:
    url_env: SUPABASE_URL
    anon_key_env: SUPABASE_ANON_KEY
    service_role_key_env: SUPABASE_SERVICE_ROLE_KEY
    access_token_env: SUPABASE_ACCESS_TOKEN
    project_id_env: SUPABASE_PROJECT_ID
    db_url_env: SUPABASE_DB_URL
  netlify:
    # Prefer NETLIFY_AUTH_TOKEN; NETLIFTY_API_KEY is a legacy alias.
    token_env: NETLIFY_AUTH_TOKEN
    legacy_token_env: NETLIFTY_API_KEY
    team_id_env: NETLIFY_TEAM_ID
    org_name_env: NETLIFTY_ORG_NAME
  railway:
    token_env: RAILWAY_API_KEY
    ssh_key_env: RAILWAY_SSH_KEY
  cloudflare:
    token_env: CLOUDFLARE_API_TOKEN
    account_id_env: CLOUDFLARE_ACCOUNT_ID
    zone_id_env: CLOUDFLARE_ZONE_ID
  stripe:
    # Test-mode only (sk_test_ / rk_test_). Live keys refused by devops_tokens.
    api_key_env: STRIPE_API_KEY
    secret_key_env: STRIPE_SECRET_KEY
    publishable_key_env: STRIPE_PUBLISHABLE_KEY
  resend:
    api_key_env: RESEND_API_KEY
  docker:
    notes: "Local Docker Engine — no cloud API key; DOCKER_HOST optional"
    endpoint_env: DOCKER_HOST
    legacy_key_env: DOCKER_API_KEY
  git_identity:
    author_name_env: GIT_AUTHOR_NAME
    author_email_env: GIT_AUTHOR_EMAIL

app_specific:
  supp_ai:
    widget_key_env: SUPP_AI_WEDGET_KEY
    api_key_env: SUPP_AI_API_KEY

docs:
  latex: "LaTeX (local toolchain, not an API — ensure texlive/tectonic installed)"
  opensource_tools: "Prefer local open-source CLIs (rg, git, docker, python) via claw /exec safe_commands"

# LiteLLM config — route to local llama.cpp OpenAI-compat server (ADR-054).
# Model name matches LITELLM_MODEL / KerrOS offline profile.

model_list:
  - model_name: qwen0.5b-q4
    litellm_params:
      model: openai/qwen0.5b-q4
      api_base: http://llama-cpp:8080/v1
      api_key: none
      custom_llm_provider: openai

litellm_settings:
  drop_params: true
  set_verbose: false
